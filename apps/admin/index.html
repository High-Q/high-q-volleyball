<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      検索エンジンインデックス拒否 (#264 / openspec/changes/admin-noindex)。
      admin は会員情報・本人確認書類など機微情報を扱う非公開アプリのため
      Google/Bing 等にインデックスさせない。多層防御として
      - HTTP `X-Robots-Tag` (render.yaml の headers)
      - HTML meta robots (本タグ)
      - /robots.txt (apps/admin/public/robots.txt)
      の 3 層で宣言する。LP / reservation は公開サイトのため本指定はしない。
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>High Q 管理画面</title>
    <!--
      HQ デザイントークン (packages/design-tokens/src/tokens.css) で指定する Web フォント。
      reservation と同じセットを admin にも入れる (両アプリ共通の意匠系を担保)。
        - Klee One        → font-jp-display
        - Zen Kaku Gothic New → font-jp
        - Shippori Mincho → font-jp-display フォールバック
        - JetBrains Mono  → font-mono
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
