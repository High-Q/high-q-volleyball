# Render Blueprint 定義 — High Q モノレポ
# このファイルが Render Dashboard 設定の **真実の源** (Blueprint mode)。
# Dashboard 側での個別変更は禁止し、すべて本ファイルへの PR 経由で管理する。
# Blueprint Instance の Auto-sync で本ファイルの変更が即反映される。
#
# 現状デプロイ対象: 3 アプリ (LP / admin / reservation) すべてを Render Static Site でデプロイ済。
# - LP        (apps/lp)          → high-q-volleyball
# - admin     (apps/admin)       → high-q-admin       (#139 で services 配列へ昇格)
# - reservation (apps/reservation) → high-q-reservation (#140 で services 配列へ昇格)

# 共通ビルド方針:
# - corepack enable: root package.json の packageManager (pnpm@10.33.2) を強制
# - --ignore-scripts: 全 lifecycle script (prepare/postinstall) を install 時にスキップ
#   jsdom v25 の prepare (convert-idl) や wireit 等の問題ある script が走らない事を保証
# - --frozen-lockfile: pnpm-lock.yaml に厳密従属
# - pnpm --filter <pkg> build: モノレポ workspace の依存解決を尊重しつつ対象アプリのみビルド
#   (#81 でモノレポ対応化。将来 admin/reservation 追加時もこの形式を踏襲)
# - 注: `--prod` は付けない。Vite/unplugin-vue-components 等の build 専用ツールは
#   devDependencies に入っているため、`--prod` だと build が失敗する (#84 で確認)。
#   build 専用 dep は最終 dist には含まれないため本番サイズに影響なし。
# CI (GitHub Actions) は別途フル install してテスト実行する想定。

services:
  # ============================================================
  # LP (apps/lp) — Vuetify ベースの公開サイト
  # ============================================================
  - type: web
    # name は既存サービスと一致させること（Blueprint は name で既存 service を識別する）。
    # ここを変えると新規サービスが二重作成される（#125 で経験済）。
    name: high-q-volleyball
    runtime: static
    rootDir: apps/lp
    branch: master

    buildCommand: corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @high-q/lp build
    staticPublishPath: dist

    # SPA history routing (path-based switch in App.vue) で /external-transmission 等の
    # サブパスへ直アクセスされた際、index.html を返してクライアント側でルーティング解決させる。
    # 静的ファイル (assets/img/favicon 等) のリクエストは publish path 内に存在すれば
    # そのまま配信され、無い場合のみ index.html にフォールバックする (Render 標準挙動)。
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # 自動デプロイ設定:
    # - autoDeployTrigger: checksPass で GitHub Actions CI が緑になった時のみデプロイ
    #   #80 で GitHub Actions CI を構築完了したため、#128 の暫定対応（commit）から本来の挙動に戻した
    #   CI が落ちている間は Render が deploy を起動しない安全側挙動になる
    # - previews.generation: automatic で全 PR に Preview 環境を自動起動
    autoDeployTrigger: checksPass
    previews:
      generation: automatic

    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render Static Site はデフォルトで buildCommand の前に自動 `npm install` を
      # 実行するが、本リポジトリは pnpm workspaces (`workspace:*`) のため npm では
      # 解釈できずビルドが失敗する (#84 PR Preview で確認)。SKIP_INSTALL_DEPS=true で
      # 自動 install を完全にスキップし、buildCommand の `corepack enable && pnpm install`
      # のみで依存解決する。
      # 公式 docs: https://render.com/docs/static-sites
      - key: SKIP_INSTALL_DEPS
        value: "true"

  # ============================================================
  # admin (apps/admin) — Vue Router + Supabase Auth ゲート付き管理画面
  # ============================================================
  # #139 で services 配列へ昇格。Supabase Auth ゲート (registerAuthGuard) と
  # 最低限の管理機能が完成したため、未完成アプリの商用公開禁止ガバナンスをクリア。
  - type: web
    name: high-q-admin
    runtime: static
    rootDir: apps/admin
    branch: master

    buildCommand: corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @high-q/admin build
    staticPublishPath: dist

    # SPA history routing (vue-router) で /members/:id 等のサブパスへ直アクセスされた際、
    # index.html を返してクライアント側でルーティング解決させる。
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    autoDeployTrigger: checksPass
    previews:
      generation: automatic

    envVars:
      - key: NODE_VERSION
        value: "22"
      # pnpm workspaces のため自動 npm install を skip させる (#84 で確立)
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # dev/prd 切替 (#184 で確立):
      # - 本番デプロイ (master push) → sync: false で Dashboard 設定された prd 値
      # - PR Preview                  → previewValue の dev 値
      # Publishable Key は公開キー (RLS で保護) のためコミット可。Secret Key は絶対に書かない。
      - key: VITE_SUPABASE_URL
        sync: false
        previewValue: https://ydkejnlivlzypizrmhwh.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
        previewValue: sb_publishable_JXCTRAx7ECO7-dZEsquKrg_VTdyXdfG

  # ============================================================
  # reservation (apps/reservation) — Vue Router + Supabase Auth (Magic Link) 付き予約サイト
  # ============================================================
  # #140 で services 配列へ昇格。マジックリンク認証 (registerAuthGuard) と
  # 本人確認書類アップロード・イベント一覧/詳細・予約/キャンセル・予約履歴・プロフィール編集の
  # 主要フローが完成したため、未完成アプリの商用公開禁止ガバナンスをクリア。
  - type: web
    name: high-q-reservation
    runtime: static
    rootDir: apps/reservation
    branch: master

    buildCommand: corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @high-q/reservation build
    staticPublishPath: dist

    # SPA history routing (vue-router) で /events/:id 等のサブパスへ直アクセスされた際、
    # index.html を返してクライアント側でルーティング解決させる。
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    autoDeployTrigger: checksPass
    previews:
      generation: automatic

    envVars:
      - key: NODE_VERSION
        value: "22"
      # pnpm workspaces のため自動 npm install を skip させる (#84 で確立)
      - key: SKIP_INSTALL_DEPS
        value: "true"
      # dev/prd 切替 (#184 で確立、#139 で admin に適用済):
      # - 本番デプロイ (master push) → sync: false で Dashboard 設定された prd 値
      # - PR Preview                  → previewValue の dev 値 (admin と同一の dev プロジェクトを共有 — §3.2)
      # Publishable Key は公開キー (RLS で保護) のためコミット可。Secret Key は絶対に書かない。
      - key: VITE_SUPABASE_URL
        sync: false
        previewValue: https://ydkejnlivlzypizrmhwh.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
        previewValue: sb_publishable_JXCTRAx7ECO7-dZEsquKrg_VTdyXdfG
