# Render Blueprint 定義 — High Q モノレポ
# このファイルが Render Dashboard 設定の **真実の源** (Blueprint mode)。
# Dashboard 側での個別変更は禁止し、すべて本ファイルへの PR 経由で管理する。
# Blueprint Instance の Auto-sync で本ファイルの変更が即反映される。
#
# 現状デプロイ対象: LP (apps/lp) のみ。
# admin (apps/admin) / reservation (apps/reservation) は機能実装と認証ゲートが
# 揃った後で services 配列に追加する（#81 で意図的に LP のみに限定。
# 未完成サイトを商用環境に公開しないための判断）。
#
# 将来 admin / reservation を追加する際の雛形は本ファイル末尾のコメント参照。

# 共通ビルド方針:
# - corepack enable: root package.json の packageManager (pnpm@10.33.2) を強制
# - --ignore-scripts: 全 lifecycle script (prepare/postinstall) を install 時にスキップ
#   jsdom v25 の prepare (convert-idl) や wireit 等の問題ある script が走らない事を保証
# - --frozen-lockfile: pnpm-lock.yaml に厳密従属
# - pnpm --filter <pkg> build: モノレポ workspace の依存解決を尊重しつつ対象アプリのみビルド
#   (#81 でモノレポ対応化。将来 admin/reservation 追加時もこの形式を踏襲)
# - 注: `--prod` は付けない。Vite/unplugin-vue-components 等の build 専用ツールは
#   devDependencies に入っているため、`--prod` だと build が失敗する (#84 で確認)。
#   build 専用 dep は最終 dist には含まれないため本番サイズに影響なし。
# CI (GitHub Actions) は別途フル install してテスト実行する想定。

services:
  # ============================================================
  # LP (apps/lp) — Vuetify ベースの公開サイト
  # ============================================================
  - type: web
    # name は既存サービスと一致させること（Blueprint は name で既存 service を識別する）。
    # ここを変えると新規サービスが二重作成される（#125 で経験済）。
    name: high-q-volleyball
    runtime: static
    rootDir: apps/lp
    branch: master

    buildCommand: corepack enable && pnpm install --frozen-lockfile --ignore-scripts && pnpm --filter @high-q/lp build
    staticPublishPath: dist

    # SPA history routing (path-based switch in App.vue) で /external-transmission 等の
    # サブパスへ直アクセスされた際、index.html を返してクライアント側でルーティング解決させる。
    # 静的ファイル (assets/img/favicon 等) のリクエストは publish path 内に存在すれば
    # そのまま配信され、無い場合のみ index.html にフォールバックする (Render 標準挙動)。
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # 自動デプロイ設定:
    # - autoDeployTrigger: checksPass で GitHub Actions CI が緑になった時のみデプロイ
    #   #80 で GitHub Actions CI を構築完了したため、#128 の暫定対応（commit）から本来の挙動に戻した
    #   CI が落ちている間は Render が deploy を起動しない安全側挙動になる
    # - previews.generation: automatic で全 PR に Preview 環境を自動起動
    autoDeployTrigger: checksPass
    previews:
      generation: automatic

    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render Static Site はデフォルトで buildCommand の前に自動 `npm install` を
      # 実行するが、本リポジトリは pnpm workspaces (`workspace:*`) のため npm では
      # 解釈できずビルドが失敗する (#84 PR Preview で確認)。SKIP_INSTALL_DEPS=true で
      # 自動 install を完全にスキップし、buildCommand の `corepack enable && pnpm install`
      # のみで依存解決する。
      # 公式 docs: https://render.com/docs/static-sites
      - key: SKIP_INSTALL_DEPS
        value: "true"

# ============================================================
# 将来追加用の雛形（admin / reservation）
# ============================================================
# 機能実装と認証ゲート完了後、以下のテンプレートを services 配列に追加する。
# 未完成サイトを商用公開しないため、現状はコメントアウトで保持。
#
# 追加時のチェックリスト:
# 1. 対象アプリで Supabase Auth ゲート（admin）または公開判断（reservation）完了
# 2. apps/<app> に最低限の機能が実装済み（スキャフォールドではない）
# 3. CLAUDE.md の「.env を読まない」ルール準拠で env var は sync: false で枠だけ定義
# 4. SPA history routing 利用時は routes に /* → /index.html リライト追加
# 5. PR レビューで「公開して問題ない状態か」を明示確認
# 6. dev/prd 切替の envVars 構造は #184 で確立済（本番値は sync:false で Dashboard 設定、
#    PR Preview 用 dev 値は previewValue で記載。Publishable Key は公開キーなのでコミット可、
#    Secret Key は絶対に previewValue に書かない）
#
# 環境変数の dev/prd 切替方針 (#184 で確立):
# - 本番デプロイ (master push) → sync: false で Dashboard に設定された値 (= prd Supabase) を使う
# - PR Preview                  → previewValue の値 (= dev Supabase) を使う
# これにより PR Preview は dev に、本番は prd にのみ書き込む安全構造が成立する。
# 参考: docs/08-移行/01-環境戦略・本番リリース計画.md §3.2
# 参考: https://render.com/docs/preview-environments
