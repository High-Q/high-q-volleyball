name: court crawler (江東区スポーツネット空き枠)

on:
  schedule:
    # 20 分間隔（design 決定 3 / #286）。cron は UTC だが 20 分間隔は時差非依存。
    # public repo のため GitHub-hosted 分は無料・無制限。
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "手動実行の理由 (例: 動作確認)"
        required: false
        default: "manual dispatch"
      monitor_all:
        description: "全室場を監視して LINE 配信を確認する一時テスト（通常は false）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      test_line:
        description: "crawl せず LINE を 1 通だけ送って配信を確認（通常は false）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      diagnose:
        description: "一時診断: crawl せず・LINE 送らず、各日のグリッド構造を sanitize してダンプ（#375 原因切り分け用・通常は false）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 直列化して多重 crawl を避ける（サイトへの politeness）。前実行は完走させる。
concurrency:
  group: court-crawler-koto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    name: crawl 江東区スポーツネット → LINE 通知
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 秘密は GitHub Secrets 由来。コード・ログには出さない（#286 5.2）。
      KOTO_USER_ID: ${{ secrets.KOTO_USER_ID }}
      KOTO_PASSWORD: ${{ secrets.KOTO_PASSWORD }}
      KOTO_LINE_CHANNEL_TOKEN: ${{ secrets.KOTO_LINE_CHANNEL_TOKEN }}
      KOTO_LINE_TO_USER_ID: ${{ secrets.KOTO_LINE_TO_USER_ID }}
      KOTO_SUPABASE_URL: ${{ secrets.KOTO_SUPABASE_URL }}
      KOTO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KOTO_SUPABASE_SERVICE_ROLE_KEY }}
      # 推奨設定: 継続的な異常（parse_empty 等）を常設アラート化する送出先。未設定でも
      # 空き検知 funnel と「生 0 件」警告は job summary に出るため run 一覧で検知できる（degraded）。
      KOTO_SENTRY_DSN: ${{ secrets.KOTO_SENTRY_DSN }}
      # 一時検証用: monitor_all=true の手動実行時のみ全室場監視（LINE 配信確認）。
      KOTO_MONITOR_ALL: ${{ github.event.inputs.monitor_all == 'true' && '1' || '' }}
      # 一時検証用: test_line=true なら crawl せず LINE を 1 通だけ送る。
      KOTO_TEST_LINE: ${{ github.event.inputs.test_line == 'true' && '1' || '' }}
      # 一時診断用: diagnose=true なら crawl せず各日のグリッド構造を sanitize してダンプ（#375）。
      KOTO_DIAGNOSE: ${{ github.event.inputs.diagnose == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable corepack (use packageManager from root package.json)
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies (offline if cache hit)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (+ OS deps)
        run: pnpm --filter @high-q/court-crawler exec playwright install --with-deps chromium

      - name: Run koto crawl
        run: pnpm --filter @high-q/court-crawler crawl:koto

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### 江東区スポーツネット crawl result"
            echo ""
            echo "- Status: ${{ job.status }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Commit SHA: \`${{ github.sha }}\`"
            echo ""
            echo "空き検知 funnel（段階別件数）は crawl step が本サマリに追記する。"
            echo "「生 0 件」警告が出続ける場合はパース/構造変化の疑い。詳細は step ログ / Sentry (KOTO_SENTRY_DSN 設定時) を参照。"
          } >> "$GITHUB_STEP_SUMMARY"
