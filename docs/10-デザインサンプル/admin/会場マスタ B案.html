<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>会場マスタ — B案</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #3f6b5e;
    --accent-soft: color-mix(in oklch, var(--accent) 12%, #fffdf8);
    --paper: #f3efe6;
    --panel: #fffdf8;
    --ink: #2a2620;
    --ink-soft: #6f685e;
    --ink-faint: #a8a094;
    --line: #e3ddd0;
    --line-strong: #d2cabb;
    --field-bg: #fbf9f3;
    --row-gap: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Shippori Mincho', serif; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: var(--ink); }

  .app { height: 100vh; display: flex; flex-direction: column; padding: 26px 34px 30px; max-width: 1480px; margin: 0 auto; }

  /* ---- header ---- */
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-bottom: 18px; border-bottom: 1.5px solid var(--ink); }
  .crumb { font-size: 12px; letter-spacing: .18em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 6px; white-space: nowrap; }
  h1 { font-size: 32px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .nav { display: flex; align-items: center; gap: 12px; }
  .navpill { border: 1.5px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 9px 20px; font-size: 14px; color: var(--ink-soft); transition: border-color .15s, color .15s; }
  .navpill:hover { border-color: var(--ink-soft); color: var(--ink); }
  .btn-solid { background: var(--ink); color: #fff; border: 1.5px solid var(--ink); border-radius: 999px; padding: 10px 22px; font-size: 14px; font-weight: 500; transition: background .15s; }
  .btn-solid:hover { background: #000; }
  .logout { background: none; border: none; color: var(--ink-faint); font-size: 14px; padding: 8px 4px; }
  .logout:hover { color: var(--ink-soft); }

  /* ---- workspace 2-pane ---- */
  .workspace { flex: 1; margin-top: 22px; min-height: 0; display: grid; grid-template-columns: 320px 1fr; background: var(--panel); border: 1.5px solid var(--line-strong); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 0 rgba(0,0,0,0.02); }

  /* list pane */
  .list { border-right: 1.5px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .list-top { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  .search { width: 100%; border: 1.5px solid var(--line-strong); background: var(--field-bg); border-radius: 999px; padding: 9px 16px; font-size: 13.5px; color: var(--ink); }
  .search::placeholder { color: var(--ink-faint); }
  .search:focus { outline: none; border-color: var(--accent); background: #fff; }
  .list-meta { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 8px; font-size: 11px; letter-spacing: .12em; color: var(--ink-faint); text-transform: uppercase; white-space: nowrap; }
  .list-scroll { overflow-y: auto; flex: 1; }
  .v-item { width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid #efeadf; padding: 13px 18px 13px 15px; border-left: 3px solid transparent; display: flex; align-items: center; gap: 10px; transition: background .12s; }
  .v-item:hover { background: #f7f3ea; }
  .v-item.sel { background: var(--accent-soft); border-left-color: var(--accent); }
  .v-item .vn { font-size: 14.5px; color: var(--ink-soft); line-height: 1.3; }
  .v-item.sel .vn { color: var(--ink); font-weight: 500; }
  .v-item .badge-mini { margin-left: auto; flex: none; font-size: 10px; letter-spacing: .04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .v-item .fee-mini { margin-left: auto; flex: none; font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
  .v-item.sel .fee-mini { color: var(--ink-soft); }
  .list-add { border: none; background: none; border-top: 1.5px solid var(--line); padding: 14px 18px; font-size: 14px; color: var(--ink-soft); text-align: left; display: flex; align-items: center; gap: 8px; }
  .list-add:hover { color: var(--accent); }

  /* detail pane */
  .detail { display: flex; flex-direction: column; min-height: 0; }
  .detail-scroll { overflow-y: auto; padding: 28px 34px 16px; flex: 1; }
  .d-head { display: flex; align-items: center; gap: 14px; margin-bottom: 3px; }
  .d-head h2 { font-size: 26px; margin: 0; font-weight: 600; }
  .badge-main { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); border: 1.5px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 4px 13px; font-size: 12px; letter-spacing: .04em; white-space: nowrap; }
  .badge-main .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .d-sub { font-size: 12px; color: var(--ink-faint); letter-spacing: .03em; margin: 4px 0 24px; }

  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; }
  .field { display: flex; flex-direction: column; }
  .field.full { grid-column: 1 / -1; }
  .flbl { font-size: 12px; color: var(--ink-faint); letter-spacing: .05em; margin-bottom: 7px; }
  .inp { border: 1.5px solid var(--line-strong); background: var(--field-bg); border-radius: 10px; padding: 11px 14px; font-size: 15px; transition: border-color .15s, background .15s; }
  .inp:focus { outline: none; border-color: var(--accent); background: #fff; }
  textarea.inp { resize: none; min-height: 84px; line-height: 1.55; }

  .seg { display: inline-flex; background: var(--field-bg); border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 3px; gap: 3px; width: fit-content; }
  .seg button { border: none; background: none; padding: 8px 18px; font-size: 14px; border-radius: 7px; color: var(--ink-soft); }
  .seg button.on { background: var(--ink); color: #fff; }

  .fee-row { display: flex; align-items: center; gap: 12px; }
  .fee-amt { display: flex; align-items: center; gap: 6px; }
  .fee-amt .yen { font-size: 18px; color: var(--ink-soft); }
  .fee-amt input { width: 120px; }
  .fee-amt.dim { opacity: .35; pointer-events: none; }

  /* main toggle */
  .toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px dashed var(--line-strong); border-radius: 10px; background: var(--field-bg); }
  .switch { position: relative; width: 44px; height: 26px; flex: none; border-radius: 999px; background: var(--line-strong); border: none; transition: background .18s; }
  .switch.on { background: var(--accent); }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on::after { transform: translateX(18px); }
  .toggle-row .tl { font-size: 14px; }
  .toggle-row .ts { font-size: 12px; color: var(--ink-faint); }

  .map-ph { height: 168px; border-radius: 10px; border: 1.5px solid var(--line-strong); background-image: repeating-linear-gradient(45deg, #efeae0 0 9px, #e6e0d4 9px 18px); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 12.5px; letter-spacing: .04em; font-family: 'SFMono-Regular', ui-monospace, monospace; }

  /* footer actions */
  .d-foot { border-top: 1.5px solid var(--line); padding: 16px 34px; display: flex; align-items: center; gap: 12px; background: color-mix(in oklch, var(--panel) 92%, var(--paper)); }
  .btn-save { background: var(--ink); color: #fff; border: 1.5px solid var(--ink); border-radius: 999px; padding: 11px 28px; font-size: 14px; font-weight: 500; }
  .btn-save:hover { background: #000; }
  .btn-cancel { background: var(--panel); color: var(--ink-soft); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 11px 22px; font-size: 14px; }
  .btn-cancel:hover { border-color: var(--ink-soft); color: var(--ink); }
  .btn-del { margin-left: auto; background: var(--panel); color: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px; padding: 11px 20px; font-size: 14px; }
  .btn-del:hover { background: var(--accent); color: #fff; }
  .dirty-note { font-size: 12px; color: var(--ink-faint); margin-left: 4px; }

  .empty-hint { color: var(--ink-faint); font-style: normal; }

  /* toast */
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 9px; border: 2px solid var(--panel); }
</style>
</head>
<body>
<div id="root"></div>

    <rect x="46" y="26" width="36" height="48" rx="3" fill="#fffdf8"/>

    <rect x="52" y="44" width="18" height="4" rx="2" fill="#d2cabb"/>

</template>
